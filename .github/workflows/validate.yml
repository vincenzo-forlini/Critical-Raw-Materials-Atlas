name: Test and validate

# The CSVs are hand-edited, so check them on every change.
on:
  push:
    paths: ['data/**', 'js/**', 'scripts/**', 'test/**', '.github/workflows/validate.yml']
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unit tests
        run: node --test

      - name: Check the CSV database
        run: node scripts/validate-data.mjs
