<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Critical Raw Materials Atlas — Europe, from mine to magnet</title>
<meta name="description" content="Where critical raw materials are mined, processed, refined, smelted, recycled and recovered across Europe — filterable by material, country and stage of the supply chain.">
<link rel="canonical" href="https://vincenzo-forlini.github.io/European-critical-network-map/">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">

<!-- Link previews. og:image has to be an absolute URL — a relative one is
     ignored by every scraper — so the host is written out here. If this ever
     moves off GitHub Pages, these four URLs are what need changing.
     LinkedIn caches a preview on first share: after editing these, push the
     change and re-run the URL through LinkedIn's Post Inspector, or the first
     share keeps the empty card for good. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Critical Raw Materials Atlas">
<meta property="og:title" content="Critical Raw Materials Atlas — Europe, from mine to magnet">
<meta property="og:description" content="Where the EU's critical raw materials are mined, processed, refined, smelted, recycled and recovered across Europe. Filter by material, country, stage or EU Strategic Project.">
<meta property="og:url" content="https://vincenzo-forlini.github.io/European-critical-network-map/">
<meta property="og:image" content="https://vincenzo-forlini.github.io/European-critical-network-map/assets/og-cover.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A dark map of Europe scattered with coloured markers, one per site, coloured by stage of the supply chain.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Critical Raw Materials Atlas — Europe, from mine to magnet">
<meta name="twitter:description" content="Where the EU's critical raw materials are mined, processed, refined, smelted, recycled and recovered across Europe. Filter by material, country, stage or EU Strategic Project.">
<meta name="twitter:image" content="https://vincenzo-forlini.github.io/European-critical-network-map/assets/og-cover.png">

<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="loading" id="loading">Loading the dataset…</div>

<div class="app" id="app">

  <header class="header">
    <div class="header__brand">
      <h1 class="header__title">Critical Raw Materials Atlas</h1>
      <a class="header__author" href="https://www.linkedin.com/in/vincenzo-forlini/"
         target="_blank" rel="noopener" title="Vincenzo Forlini on LinkedIn">Vincenzo Forlini</a>
      <span class="header__sub">Europe, from mine to magnet</span>
    </div>
    <div class="header__spacer"></div>
    <div class="header__actions">
      <span class="data-banner" title="Every record carries a source link and a confidence flag. Check before citing.">Seed dataset — verify before citing</span>
      <span class="header__updated" id="last-updated" title="The most recent last_checked date in the dataset"></span>
      <button class="btn btn--sm btn--accent" id="open-periodic">Explore the CRMs</button>
      <a class="btn btn--sm" href="about.html">About</a>
    </div>
  </header>

  <div class="fbar" id="fbar" role="toolbar" aria-label="Filters">
    <div class="search">
      <input type="search" id="search" placeholder="Search site, company or city…" aria-label="Search sites, companies and cities">
      <button class="search__clear" id="search-clear" hidden aria-label="Clear search">&times;</button>
    </div>
    <div class="fbar__sep"></div>
    <div class="fbar__pills" id="filter-pills"></div>
    <button class="btn btn--sm fbar__reset" id="reset-all">Reset</button>
    <div class="fbar__spacer"></div>
  </div>

  <div class="fpops" id="filter-pops" hidden></div>

  <div class="main" id="main">

    <aside class="sidebar" id="sidebar" aria-label="Results">

      <div class="panel-scroll">
        <div id="panel-results"></div>
      </div>
    </aside>

    <div class="map-wrap">
      <div id="map"></div>

      <button class="panel-handle" id="toggle-sidebar" aria-label="Hide the filter panel" aria-expanded="true">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>
      </button>

      <div class="legend" id="legend" aria-label="Map legend"></div>
      <div class="map-note" id="map-note"></div>
    </div>

  </div>

  <aside class="detail" id="detail" aria-label="Details" aria-live="polite">
    <div class="detail__nav">
      <button type="button" class="detail__back" id="detail-back" hidden>&larr; Back</button>
      <button type="button" class="detail__close" id="detail-close" aria-label="Close the details panel">&times;</button>
    </div>
    <div class="detail__body" id="detail-body"></div>
  </aside>
</div>

<!-- Periodic table: which chemical elements the EU treats as critical. -->
<div class="modal" id="periodic" hidden role="dialog" aria-modal="true" aria-labelledby="periodic-title">
  <div class="modal__card modal__card--wide">
    <div class="modal__head">
      <h2 id="periodic-title">Explore the critical raw materials</h2>
      <div class="header__spacer"></div>
      <button class="btn btn--ghost btn--sm" id="periodic-close" aria-label="Close">&times;</button>
    </div>
    <div class="modal__body" id="periodic-body"></div>
  </div>
</div>

<!-- Data problems surface here rather than failing silently. -->
<div class="errors" id="errors" hidden>
  <div class="errors__head">
    <span class="errors__title" id="errors-title">Data problems</span>
    <button class="btn btn--ghost btn--sm" id="errors-close" aria-label="Dismiss">&times;</button>
  </div>
  <div class="errors__body" id="errors-body"></div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
